name: Deploy Chronos

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tienzo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Setup Secrets
        env:
          CHRONOS_DB_PASSWORD: ${{ secrets.CHRONOS_DB_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CHRONOS_WEBHOOK_SECRET: ${{ secrets.CHRONOS_WEBHOOK_SECRET }}
          MUNINN_MASTER_KEY: ${{ secrets.MUNINN_MASTER_KEY }}
        run: |
          if [ -z "${CHRONOS_DB_PASSWORD}" ]; then
            echo "Error: CHRONOS_DB_PASSWORD secret is required" >&2
            exit 1
          fi
          if [ -z "${VAPID_PRIVATE_KEY}" ]; then
            echo "Error: VAPID_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          if [ -z "${CHRONOS_WEBHOOK_SECRET}" ]; then
            echo "Error: CHRONOS_WEBHOOK_SECRET secret is required" >&2
            exit 1
          fi
          if [ -z "${MUNINN_MASTER_KEY}" ]; then
            echo "Error: MUNINN_MASTER_KEY secret is required" >&2
            exit 1
          fi
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          echo "CHRONOS_DB_PASSWORD_NAME=$(printf '%s' "$CHRONOS_DB_PASSWORD" | /tmp/ensure_secret.sh chronos_db_password)" >> $GITHUB_ENV
          echo "CHRONOS_VAPID_PRIVATE_KEY_NAME=$(printf '%s' "$VAPID_PRIVATE_KEY" | /tmp/ensure_secret.sh chronos_vapid_private_key)" >> $GITHUB_ENV
          echo "CHRONOS_WEBHOOK_SECRET_NAME=$(printf '%s' "$CHRONOS_WEBHOOK_SECRET" | /tmp/ensure_secret.sh chronos_webhook_secret)" >> $GITHUB_ENV
          echo "CHRONOS_MUNINN_API_KEY_NAME=$(printf '%s' "$MUNINN_MASTER_KEY" | /tmp/ensure_secret.sh chronos_muninn_api_key)" >> $GITHUB_ENV

      - name: Prepare host data directory
        env:
          CHRONOS_DB_MOUNT_PATH: ${{ vars.CHRONOS_DB_MOUNT_PATH }}
        run: |
          DB_DIR="${CHRONOS_DB_MOUNT_PATH:-/opt/chronos/data}"
          docker run --rm -v "${DB_DIR}":/data alpine mkdir -p /data

      - name: Validate Required Configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          CHRONOS_DB_PASSWORD: ${{ secrets.CHRONOS_DB_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          CHRONOS_WEBHOOK_SECRET: ${{ secrets.CHRONOS_WEBHOOK_SECRET }}
          MUNINN_MASTER_KEY: ${{ secrets.MUNINN_MASTER_KEY }}
        run: |
          MISSING=""
          [ -z "$DOMAIN_NAME" ] && MISSING="$MISSING DOMAIN_NAME"
          [ -z "$REGISTRY_PREFIX" ] && MISSING="$MISSING REGISTRY_PREFIX"
          [ -z "$CHRONOS_DB_PASSWORD" ] && MISSING="$MISSING CHRONOS_DB_PASSWORD"
          [ -z "$VAPID_PRIVATE_KEY" ] && MISSING="$MISSING VAPID_PRIVATE_KEY"
          [ -z "$VAPID_PUBLIC_KEY" ] && MISSING="$MISSING VAPID_PUBLIC_KEY"
          [ -z "$VAPID_SUBJECT" ] && MISSING="$MISSING VAPID_SUBJECT"
          [ -z "$CHRONOS_WEBHOOK_SECRET" ] && MISSING="$MISSING CHRONOS_WEBHOOK_SECRET"
          [ -z "$MUNINN_MASTER_KEY" ] && MISSING="$MISSING MUNINN_MASTER_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Deployment halted: missing required configuration:$MISSING" >&2
            exit 1
          fi

      - name: Build and Deploy with Docker Compose
        env:
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CHRONOS_DB_MOUNT_PATH: ${{ vars.CHRONOS_DB_MOUNT_PATH || '/opt/chronos/data' }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          IMAGE_TAG: chronos
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "chronos" docker-compose.yml

      - name: Verify Post-Deploy Swarm Convergence
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/verify_convergence.sh -o /tmp/verify_convergence.sh
          chmod +x /tmp/verify_convergence.sh
          /tmp/verify_convergence.sh "chronos" chronos_chronos-api chronos_chronos-db
